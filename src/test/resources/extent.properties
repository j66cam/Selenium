########################################################################################################################
# Generated Reports
########################################################################################################################
extent.reporter.spark.start=true

# This property transforms the screenshot (if any) into base64, so that it is not saved physically but displayed by bytes
# If the value is true, the properties of the Screenshot should be commented out
extent.reporter.spark.base64imagesrc=true
extent.reporter.spark.config=src/test/resources/extent-spark-config.xml
extent.reporter.spark.out=SparkReport/SparkReport.html

extent.reporter.pdf.start=true
extent.reporter.pdf.out=PDFReport/PDFReport.pdf

extent.reporter.logger.start=false
extent.reporter.logger.out=LoggerReport/

extent.reporter.json.start=false
extent.reporter.json.out=JsonReport/JsonReport.json

extent.reporter.html.start=false
extent.reporter.html.config=src/test/resources/extent-html-config.xml
extent.reporter.html.out=HtmlReport/HtmlReport.html

########################################################################################################################
# Screenshot
########################################################################################################################
#screenshot.dir=/Screenshots/
#screenshot.rel.path=../Screenshots/

########################################################################################################################
# Adding folder name and non-repeating pattern
########################################################################################################################
basefolder.name=target/SparkReport
basefolder.datetimepattern=d_MMM_YY
#basefolder.datetimepattern=d_MMM_YY HH_mm_ss

########################################################################################################################
# Basic info
########################################################################################################################
systeminfo.os=Windows
systeminfo.version=10
systeminfo.Engineer=Juan
systeminfo.Project=CucumberProjectDemo
systeminfo.Browser=Google Chrome
systeminfo.appname=Demo QA